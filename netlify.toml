[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Blobs is available by default on all Netlify sites with Functions.
# No additional configuration required — getStore() is injected at runtime.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
