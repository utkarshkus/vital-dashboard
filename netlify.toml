[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Blobs is available by default on all Netlify sites with Functions.
# Required env vars (set in Netlify UI → Site configuration → Environment variables):
#   WHOOP_CLIENT_ID      — from developer.whoop.com
#   WHOOP_CLIENT_SECRET  — from developer.whoop.com
#   WHOOP_REDIRECT_URI   — https://YOUR-SITE.netlify.app/.netlify/functions/auth-callback

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
