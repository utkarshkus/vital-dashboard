[build]
  publish = "."
  functions = "netlify/functions"

# Required env vars (Netlify UI → Site configuration → Environment variables):
#   WHOOP_CLIENT_ID      — from developer.whoop.com
#   WHOOP_CLIENT_SECRET  — from developer.whoop.com
#   WHOOP_REDIRECT_URI   — https://YOUR-SITE.netlify.app/api/auth-callback
#
# Also update the redirect URI in your WHOOP developer app to match.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
