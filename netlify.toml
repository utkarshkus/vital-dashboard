[build]
  publish = "."
  functions = "netlify/functions"

# Required env vars (Netlify UI → Site configuration → Environment variables):
#   WHOOP_CLIENT_ID      — from developer.whoop.com
#   WHOOP_CLIENT_SECRET  — from developer.whoop.com
#   WHOOP_REDIRECT_URI   — https://YOUR-SITE.netlify.app/.netlify/functions/auth-callback

# /api/* → /.netlify/functions/:splat  (must come BEFORE the catch-all)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

# SPA catch-all — serves index.html for all non-file, non-api routes
# login.html is a real file so it bypasses this rule automatically
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'"
