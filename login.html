<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vital · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 2.5rem;
  width: 100%;
  max-width: 400px;
}
.login-brand {
  font-family: var(--font-head);
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.15rem;
}
.login-brand .accent { color: var(--accent); }
.login-tagline {
  font-size: 0.75rem;
  color: var(--text3);
  margin-bottom: 2rem;
  letter-spacing: 0.04em;
}
.login-title {
  font-family: var(--font-head);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
  color: var(--text);
}
.login-hint {
  font-size: 0.75rem;
  color: var(--text2);
  margin-bottom: 1.25rem;
  line-height: 1.5;
}
.login-field {
  margin-bottom: 1rem;
}
.login-field label {
  display: block;
  font-size: 0.7rem;
  color: var(--text2);
  margin-bottom: 0.35rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.login-field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 0.65rem 0.85rem;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s;
}
.login-field input:focus {
  border-color: var(--accent);
}
.login-btn {
  width: 100%;
  padding: 0.75rem;
  margin-top: 0.5rem;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}
.login-btn:hover   { opacity: 0.85; }
.login-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.login-error {
  background: rgba(240,112,112,0.1);
  border: 1px solid var(--danger);
  border-radius: var(--radius-sm);
  padding: 0.55rem 0.8rem;
  font-size: 0.78rem;
  color: var(--danger);
  margin-top: 0.75rem;
  display: none;
}
.login-error.visible { display: block; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">vital<span class="accent">.</span></div>
    <div class="login-tagline">health dashboard</div>

    <!-- Login form (default) -->
    <div id="loginForm">
      <div class="login-title">Sign in</div>
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button class="login-btn" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </div>

    <!-- First-time setup form (shown when no users exist) -->
    <div id="setupForm" style="display:none">
      <div class="login-title">Create your account</div>
      <div class="login-hint">First-time setup — create the admin account to get started.</div>
      <div class="login-field">
        <label for="setupUsername">Username</label>
        <input type="text" id="setupUsername" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="login-field">
        <label for="setupPassword">Password</label>
        <input type="password" id="setupPassword" autocomplete="new-password">
      </div>
      <div class="login-field">
        <label for="setupConfirm">Confirm password</label>
        <input type="password" id="setupConfirm" autocomplete="new-password">
      </div>
      <button class="login-btn" id="setupBtn">Create account</button>
      <div class="login-error" id="setupError"></div>
    </div>

  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
